name: Scan and post
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      post:
        description: "Post top picks to the Telegram channel"
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Publish any due scheduled articles
        run: python -m scanner.publish_scheduled
      - name: Scan, write feed, autopost
        run: python -m scanner.scan --post "${{ github.event.inputs.post || 'true' }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          AUTOPOST_COUNT: ${{ secrets.AUTOPOST_COUNT }}
          SITE_URL: ${{ secrets.SITE_URL }}
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
      - name: Commit data and docs
        run: |
          git config user.name "pulsebyte-bot"
          git config user.email "pulsebyte-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || (git commit -m "Update feed & publish scheduled articles [bot]" && git pull --rebase && git push)
