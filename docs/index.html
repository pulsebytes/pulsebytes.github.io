<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>pulsebyte: what developers are shipping right now</title>
<meta name="description" content="Fresh projects from GitHub, GitLab, Codeberg, Hugging Face and Product Hunt. Search, filter and share what is trending.">
<meta property="og:title" content="pulsebyte"><meta property="og:description" content="What developers are shipping right now.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b3df5'/%3E%3Cpath d='M5 17h5l3-8 5 14 3-6h6' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<script>document.documentElement.dataset.theme=localStorage.getItem("pb-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")</script>
<style>
:root{--bg:#f5f6fa;--panel:#fff;--ink:#12141f;--mute:#5d6378;--line:#e1e4ee;--acc:#5b3df5;--acc-ink:#fff;--hot:#e8481f;--soft:#eceafe;--shadow:0 1px 2px rgba(18,20,31,.06)}
[data-theme=dark]{--bg:#0d0e16;--panel:#151722;--ink:#eceef6;--mute:#9aa1b8;--line:#262a3b;--acc:#8b7bff;--acc-ink:#0d0e16;--hot:#ff7a50;--soft:#211f3d;--shadow:none}
*{box-sizing:border-box}html{scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:920px;margin:0 auto;padding:0 20px}
a{color:inherit}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
header{display:flex;align-items:center;gap:10px;padding:18px 0}
.logo{display:flex;align-items:center;gap:10px;font:700 22px "Bricolage Grotesque",sans-serif;letter-spacing:-.03em;text-decoration:none;flex:1}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--acc);display:grid;place-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:10px;text-decoration:none;font-weight:500;box-shadow:var(--shadow);transition:border-color .15s}
.btn:hover{border-color:var(--acc)}.btn.p{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.icon{width:38px;height:38px;padding:0;justify-content:center}
h1{font:700 clamp(32px,6vw,56px)/1.04 "Bricolage Grotesque",sans-serif;letter-spacing:-.035em;margin:34px 0 12px;max-width:16ch}
.sub{color:var(--mute);max-width:52ch;margin:0 0 24px}
.search{position:relative}.search input{width:100%;font:inherit;font-size:18px;padding:16px 56px 16px 50px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.search input::placeholder{color:var(--mute)}.search svg{position:absolute;left:17px;top:50%;transform:translateY(-50%);color:var(--mute)}
.search kbd{position:absolute;right:14px;top:50%;transform:translateY(-50%);border:1px solid var(--line);border-radius:6px;padding:1px 8px;color:var(--mute);font:500 13px Figtree}
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);margin-top:18px;padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;flex:1;scrollbar-width:none;padding:2px}.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 13px;font-size:14px;display:flex;gap:7px;align-items:center}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}.chip em{font-style:normal;opacity:.6}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:6px 14px;font-size:14px}.seg button[aria-pressed=true]{background:var(--soft);color:var(--acc);font-weight:600}
.meta{color:var(--mute);font-size:14px;margin:16px 0 6px}
.row{border-bottom:1px solid var(--line)}
.head{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:start;padding:18px 4px;cursor:pointer}
.head:hover .nm b{color:var(--acc)}.rank{font:700 22px "Bricolage Grotesque",sans-serif;color:var(--line);letter-spacing:-.03em;padding-top:1px}
[data-theme=dark] .rank{color:#343a52}
.nm{font-size:18px;overflow-wrap:anywhere}.nm span{color:var(--mute)}.nm b{font-weight:600;transition:color .15s}
.desc{color:var(--mute);margin:3px 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--mute)}.tags span{display:inline-flex;gap:6px;align-items:center}
.score{text-align:right;font:700 20px "Bricolage Grotesque",sans-serif;color:var(--hot);letter-spacing:-.02em;white-space:nowrap}.score small{display:block;font:400 12px Figtree;color:var(--mute);letter-spacing:0}
.more{display:none;padding:0 4px 20px 62px}.row.open .more{display:block;animation:in .2s ease-out}.row.open .desc{-webkit-line-clamp:unset}
@keyframes in{from{opacity:0;transform:translateY(-4px)}}
.why{background:var(--soft);border-radius:12px;padding:12px 14px;margin-bottom:12px}.why strong{display:block;font-size:13px;color:var(--acc);margin-bottom:2px}
.topics{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.topics span{font-size:13px;background:var(--panel);border:1px solid var(--line);padding:1px 10px;border-radius:999px;color:var(--mute)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.state{text-align:center;padding:56px 12px;color:var(--mute)}.state h3{color:var(--ink);font:700 22px "Bricolage Grotesque";margin:0 0 6px}
.sk{height:84px;margin:14px 0;border-radius:12px;background:linear-gradient(90deg,var(--line),var(--panel),var(--line));background-size:200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
footer{color:var(--mute);font-size:14px;padding:36px 0 56px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;font-size:14px}#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){.head{grid-template-columns:30px 1fr}.score{grid-column:2;text-align:left;display:flex;gap:6px;align-items:baseline}.more{padding-left:44px}.seg{margin-left:auto}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="wrap">
<header><a class="logo" href="./"><i><svg width="16" height="16" viewBox="0 0 32 32"><path d="M4 17h6l3-9 6 16 3-7h6" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></i>pulsebyte</a>
<a class="btn p" id="join" hidden target="_blank" rel="noopener">Join the Telegram channel</a>
<button class="btn icon" id="theme" aria-label="Switch light or dark theme"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></header>
<h1>What developers are shipping right now</h1>
<p class="sub">Fresh projects from GitHub, GitLab, Codeberg, Hugging Face and Product Hunt, refreshed every 6 hours.</p>
<label class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
<input id="q" type="search" placeholder="Search by name, topic or language" autocomplete="off" aria-label="Search projects"><kbd>/</kbd></label>
<div class="bar"><div class="chips" id="chips" role="group" aria-label="Filter by source"></div>
<div class="seg" role="group" aria-label="Sort"><button data-s="top" aria-pressed="true">Top</button><button data-s="new" aria-pressed="false">New</button></div></div>
<div class="meta" id="meta" aria-live="polite"></div>
<main id="list"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></main>
<footer>Picked by a scheduled GitHub job and written up with Gemini. The same picks go out on the Telegram channel.</footer>
</div><div id="toast" role="status"></div>
<script src="config.js"></script>
<script>
const CFG=window.PULSEBYTE||{},$=s=>document.querySelector(s);
const SRC={GitHub:["#8b93a7","stars"],GitLab:["#fc6d26","stars"],Codeberg:["#2185d0","stars"],HuggingFace:["#f5b400","likes"],ProductHunt:["#da552f","votes"]};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>n>=1e4?Math.round(n/1e3)+"k":n>=1e3?(n/1e3).toFixed(1)+"k":String(n);
const ago=t=>{if(!t)return"";const d=Math.max(0,(Date.now()-new Date(t))/864e5);return d<1?"today":d<2?"yesterday":d<30?Math.floor(d)+" days ago":Math.floor(d/30)+" months ago"};
let S={items:[],at:0,q:"",src:new Set(),sort:"top",open:""};
function readHash(){const p=new URLSearchParams(location.hash.slice(1));S.q=p.get("q")||"";S.src=new Set((p.get("src")||"").split(",").filter(Boolean));S.sort=p.get("sort")||"top";S.open=p.get("p")||"";$("#q").value=S.q}
function writeHash(){const p=new URLSearchParams();if(S.q)p.set("q",S.q);if(S.src.size)p.set("src",[...S.src]);if(S.sort!=="top")p.set("sort",S.sort);if(S.open)p.set("p",S.open);history.replaceState(null,"",p.toString()?"#"+p:location.pathname+location.search)}
function view(){const q=S.q.toLowerCase();let r=S.items.filter(i=>(!S.src.size||S.src.has(i.src))&&(!q||[i.name,i.desc,i.lang,i.src,...(i.topics||[])].join(" ").toLowerCase().includes(q)));
return r.sort(S.sort==="new"?(a,b)=>new Date(b.created||0)-new Date(a.created||0):(a,b)=>b.score-a.score)}
function render(){
 const counts={};S.items.forEach(i=>counts[i.src]=(counts[i.src]||0)+1);
 $("#chips").innerHTML=Object.keys(counts).map(s=>`<button class="chip" data-src="${s}" aria-pressed="${S.src.has(s)}"><span class="dot" style="background:${(SRC[s]||["#888"])[0]}"></span>${s}<em>${counts[s]}</em></button>`).join("");
 document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.s===S.sort));
 const r=view();$("#meta").textContent=S.items.length?`${r.length} of ${S.items.length} projects`+(S.at?`, updated ${ago(S.at).replace("today","today").replace(/^(\d+)/,"$1")}`:""):"";
 if(!S.items.length)return $("#list").innerHTML=`<div class="state"><h3>No data yet</h3>The first scan has not run. Check back soon.</div>`;
 if(!r.length)return $("#list").innerHTML=`<div class="state"><h3>Nothing matches “${esc(S.q)}”</h3>Try another word or <button class="btn" id="clear">clear filters</button></div>`;
 $("#list").innerHTML=r.map((i,n)=>{const [o,...rest]=i.name.split("/"),rp=rest.join("/"),[c,u]=SRC[i.src]||["#888","points"],op=S.open===i.id;
 return `<article class="row${op?" open":""}" id="r-${esc(i.id)}"><button class="head" data-id="${esc(i.id)}" aria-expanded="${op}"><span class="rank">${n+1}</span>
 <span><span class="nm">${rp?`<span>${esc(o)}/</span><b>${esc(rp)}</b>`:`<b>${esc(o)}</b>`}</span><span class="desc" style="display:-webkit-box">${esc(i.desc||"No description yet")}</span>
 <span class="tags"><span><i class="dot" style="background:${c}"></i>${i.src}</span>${i.lang?`<span>${esc(i.lang)}</span>`:""}${i.created?`<span>${ago(i.created)}</span>`:""}</span></span>
 <span class="score">${fmt(i.score)}<small>${u}</small></span></button>
 <div class="more">${i.blurb?`<div class="why"><strong>Why it matters</strong>${esc(i.blurb)}</div>`:""}
 ${(i.topics||[]).length?`<div class="topics">${i.topics.map(t=>`<span>${esc(t)}</span>`).join("")}</div>`:""}
 <div class="acts"><a class="btn p" href="${esc(i.url)}" target="_blank" rel="noopener">Open project</a>
 <button class="btn" data-act="copy" data-id="${esc(i.id)}">Copy link</button>
 <a class="btn" target="_blank" rel="noopener" href="${sh(i,"t")}">Telegram</a><a class="btn" target="_blank" rel="noopener" href="${sh(i,"x")}">X</a><a class="btn" target="_blank" rel="noopener" href="${sh(i,"w")}">WhatsApp</a>
 ${navigator.share?`<button class="btn" data-act="native" data-id="${esc(i.id)}">More</button>`:""}</div></div></article>`}).join("")}
const link=i=>location.origin+location.pathname+"#p="+encodeURIComponent(i.id);
function sh(i,k){const u=encodeURIComponent(link(i)),t=encodeURIComponent(`${i.name}: ${i.desc||"trending project"} (via pulsebyte)`);
 return k==="t"?`https://t.me/share/url?url=${u}&text=${t}`:k==="x"?`https://twitter.com/intent/tweet?text=${t}&url=${u}`:`https://wa.me/?text=${t}%20${u}`}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1800)}
$("#list").addEventListener("click",e=>{
 const h=e.target.closest(".head");if(h){S.open=S.open===h.dataset.id?"":h.dataset.id;writeHash();return render()}
 const a=e.target.closest("[data-act]");if(a){const i=S.items.find(x=>x.id===a.dataset.id);
  if(a.dataset.act==="copy")navigator.clipboard.writeText(link(i)).then(()=>toast("Link copied"));else navigator.share({title:i.name,text:i.desc,url:link(i)}).catch(()=>{})}
 if(e.target.id==="clear"){S.q="";S.src.clear();$("#q").value="";writeHash();render()}});
$("#chips").addEventListener("click",e=>{const c=e.target.closest(".chip");if(!c)return;S.src.has(c.dataset.src)?S.src.delete(c.dataset.src):S.src.add(c.dataset.src);writeHash();render()});
document.querySelector(".seg").addEventListener("click",e=>{if(e.target.dataset.s){S.sort=e.target.dataset.s;writeHash();render()}});
$("#q").addEventListener("input",e=>{S.q=e.target.value.trim();writeHash();render()});
addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement.id!=="q"){e.preventDefault();$("#q").focus()}if(e.key==="Escape"&&document.activeElement.id==="q"){$("#q").value="";S.q="";writeHash();render();$("#q").blur()}});
$("#theme").onclick=()=>{const d=document.documentElement,n=d.dataset.theme==="dark"?"light":"dark";d.dataset.theme=n;try{localStorage.setItem("pb-theme",n)}catch{}};
if(CFG.channel){const j=$("#join");j.href=CFG.channel;j.hidden=false}
function apply(d){S.items=d.items||[];S.at=d.updated_at||0;render();if(S.open){const el=document.getElementById("r-"+S.open);el&&el.scrollIntoView({block:"center"})}}
async function boot(){readHash();
 try{const c=JSON.parse(localStorage.getItem("pb-feed"));if(c)apply(c)}catch{}
 if(!CFG.api)return $("#list").innerHTML=`<div class="state"><h3>Site not configured</h3>Run <b>run.cmd</b> to connect it to your GitHub repo.</div>`;
 try{const r=await fetch(CFG.api);if(!r.ok)throw 0;const d=await r.json();apply(d);try{localStorage.setItem("pb-feed",JSON.stringify(d))}catch{}}
 catch{if(!S.items.length)$("#list").innerHTML=`<div class="state"><h3>Can’t reach the feed</h3>Check your connection and <button class="btn" onclick="boot()">try again</button></div>`}}
addEventListener("hashchange",()=>{readHash();render()});boot();
</script></body></html>
